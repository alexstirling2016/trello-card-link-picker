<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point d’avancement</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="config.js"></script>
<style>
:root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
body { margin: 16px; }
label { display: block; margin-bottom: 8px; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 250px; padding: 10px; font: inherit; resize: vertical; }
button { margin-top: 12px; padding: 6px 12px; font: inherit; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.actions button { margin: 0; }
#status { margin-inline-start: 8px; }
</style>
</head>
<body>
<label for="prompt">Copiez le prompt et, si votre conversation n’a pas accès au tableau, joignez le fichier JSON Trello.</label>
<textarea id="prompt" readonly>Lis le tableau Trello Promo Lecture — CDP (https://trello.com/b/zquu24NZ/promo-lecture-cdp), en incluant les cartes hors Focus, et rédige en français un point d’avancement prêt à dire en réunion. Ouvre par les sujets à préparer ou à traiter maintenant, notamment les rendez-vous imminents et les cartes marquées « Urgence forcée ». Précise la prochaine action concrète pour chacun. Poursuis par de courts paragraphes d’une à trois phrases par chantier ou groupe de sujets. Mets le nom du chantier en gras en début de paragraphe. Dans chaque paragraphe, mets aussi en gras les courtes formulations qui nomment les actions clés, les relances ou les préalables à traiter. Privilégie une formulation concrète avec un verbe et son complément, par exemple « **Mettre à jour les accès aux ressources sur le site** ». Limite le gras à ces éléments pour faciliter la lecture. Si des urgences isolées se disputent l’attention, regroupe-les dans un court paragraphe distinct. Sépare les paragraphes par une ligne blanche.

Regroupe l’attention par chantier. Pars des chantiers et actions en Focus, puis ajoute les priorités hautes, les échéances ou relances proches ou dépassées et les urgences forcées qui changent l’ordre du jour. Rattache chaque action Kanban à son chantier via « Chant. par. » ou un lien explicite lorsqu’il existe. Fais ressortir aussi les actions isolées qui méritent l’attention, sans leur inventer de rattachement. Si plusieurs urgences indépendantes dispersent l’attention, dis-le clairement, même si elles relèvent de chantiers différents. Cite un ou deux exemples et indique lesquels traiter en premier, d’après les échéances, les priorités ou ce qu’ils peuvent débloquer. Ne recommande de mettre un chantier en Focus que si le rattachement est établi et si cela aide à concentrer le travail. Dis ce qui a avancé et à quoi cela sert pour le chantier. Distingue une action associée, un préalable encore ouvert et une contribution (« Alimente »). Regroupe sous le chantier les deux à quatre actions et préalables qui déterminent la suite. Dans chaque chantier, présente d’abord les préalables ouverts qui conditionnent la suite, puis les autres actions Kanban. Explique ce que chaque préalable doit débloquer. Si un préalable demande du travail ou conditionne le lancement, signale qu’il faut l’engager tôt, même si l’échéance finale est encore loin. Par exemple, si la mise à jour du site est un préalable à la campagne de visibilité, fais apparaître l’effort à lancer sous la campagne, avec les autres actions qui la font avancer. Si une urgence hors Focus mérite de réorienter le travail, propose de mettre temporairement le chantier concerné en Focus et explique pourquoi.

Pour chaque attente ou blocage significatif, dis ce qui attend, de qui dépend la suite et quelle réponse, décision ou contribution manque. Croise le statut de la carte, « En attente de », « Blocage », « Interloc. », « Relance » et les cartes liées. Un interlocuteur seul ne prouve pas une attente. Une attente sur une action ne bloque pas forcément tout le chantier. Si une priorité haute est bloquée, dis-le clairement et indique qui relancer, à quelle date si elle est renseignée, ou quelle autre action peut débloquer la suite.

Indique la prochaine étape utile à partir de « Proch. act. » ou d’une action Kanban encore ouverte. Si ces éléments manquent, présente toute prochaine étape comme une proposition. Distingue la date de relance, l’échéance d’une action et le jalon du chantier. Appuie-toi sur les champs renseignés et les notes pertinentes du tableau. Ne déduis ni responsable, ni échéance, ni progrès d’un champ vide. Signale brièvement toute incertitude qui change le point d’avancement. Si le tableau est inaccessible, demande un export récent.</textarea>
<div class="actions">
  <button id="copy" type="button">Copier le prompt</button>
  <button id="copy-and-download" type="button">Copier le prompt et télécharger le JSON</button>
  <a href="./open-chatgpt.html" target="_blank" rel="noopener noreferrer">Ouvrir ChatGPT (app)</a>
  <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Ouvrir ChatGPT Web</a>
</div>
<span id="status" role="status"></span>
<a id="export-fallback" href="https://trello.com/b/zquu24NZ.json" target="_blank" rel="noopener noreferrer" hidden>Ouvrir le JSON Trello et l’enregistrer</a>
<script>
const promptField = document.querySelector("#prompt");
const status = document.querySelector("#status");
async function copyPrompt() {
  try {
    await navigator.clipboard.writeText(promptField.value);
    status.textContent = "Prompt copié.";
  } catch {
    promptField.focus();
    promptField.select();
    if (document.execCommand("copy")) {
      status.textContent = "Prompt copié.";
    } else {
      status.textContent = "Texte sélectionné. Utilisez le raccourci Copier.";
    }
  }
}

document.querySelector("#copy").addEventListener("click", copyPrompt);
const download = document.querySelector("#copy-and-download");
const fallback = document.querySelector("#export-fallback");

async function readTrello(path, query, key, token) {
  const url = new URL("https://api.trello.com/1/" + path);
  url.search = new URLSearchParams({...query, key, token});
  const response = await fetch(url, {referrerPolicy: "no-referrer"});
  if (!response.ok) throw new Error("Export Trello indisponible.");
  return response.json();
}

download.addEventListener("click", async () => {
  download.disabled = true;
  fallback.hidden = true;
  try {
    await copyPrompt();
    const copyStatus = status.textContent;
    status.textContent = copyStatus + " Préparation du JSON…";
    const config = window.pickerConfig;
    const client = window.TrelloPowerUp.iframe(config);
    const rest = await client.getRestApi();
    const token = await rest.getToken();
    const boardId = client.getContext().board;
    if (!token || !boardId) throw new Error("Accès Trello indisponible.");
    const path = "boards/" + encodeURIComponent(boardId);
    const read = (suffix, query) => readTrello(path + suffix, query, config.appKey, token);
    const [board, checklists, actions] = await Promise.all([
      read("", {cards: "all", card_fields: "all", card_customFieldItems: "true", lists: "all", labels: "all", customFields: "true"}),
      read("/checklists", {}),
      read("/actions", {filter: "all", limit: "1000"}),
    ]);
    const file = new Blob([JSON.stringify({...board, checklists, actions}, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = "promo-lecture-cdp.json";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    status.textContent = copyStatus + " Téléchargement lancé.";
  } catch {
    status.textContent += " Le téléchargement direct a échoué. Ouvrez le JSON puis utilisez Enregistrer sous.";
    fallback.hidden = false;
  } finally {
    download.disabled = false;
  }
});
</script>
</body>
</html>
