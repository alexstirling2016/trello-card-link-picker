<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point d’avancement</title>
<style>
:root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
body { margin: 16px; }
label { display: block; margin-bottom: 8px; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 250px; padding: 10px; font: inherit; resize: vertical; }
button { margin-top: 12px; padding: 6px 12px; font: inherit; cursor: pointer; }
#status { margin-inline-start: 8px; }
</style>
</head>
<body>
<label for="prompt">Copiez le prompt, puis collez-le dans votre conversation avec accès à Trello.</label>
<textarea id="prompt" readonly>Lis l’état actuel du tableau Trello Promo Lecture — CDP (https://trello.com/b/zquu24NZ/promo-lecture-cdp) et rédige en français un point d’avancement en un seul paragraphe, prêt à dire en réunion.

Regroupe les sujets par chantier. Un sujet mérite l’attention s’il est marqué Focus, s’il est de priorité haute ou si son échéance approche ou est dépassée. Pars des chantiers en Focus et rattache chaque action Kanban à son chantier parent. Pour chaque groupe, dis ce qui avance et explique concrètement ce que les actions apportent au chantier. Mentionne un préalable, une réponse attendue ou une contribution à un autre chantier quand cela change la suite du travail.

Fais aussi ressortir les sujets importants hors Focus. Si une priorité haute ou une échéance proche justifie de revoir les choix du moment, propose de mettre temporairement le chantier concerné en Focus et explique pourquoi. Ouvre sur ce qui mérite le plus d’attention, puis indique les prochaines étapes utiles. Appuie-toi sur le tableau et signale brièvement toute incertitude qui change le point d’avancement. Si le tableau est inaccessible, demande un accès ou un export récent.</textarea>
<button id="copy" type="button">Copier le prompt</button>
<span id="status" role="status"></span>
<script>
const promptField = document.querySelector("#prompt");
const status = document.querySelector("#status");
document.querySelector("#copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(promptField.value);
    status.textContent = "Prompt copié.";
  } catch {
    promptField.focus();
    promptField.select();
    if (document.execCommand("copy")) {
      status.textContent = "Prompt copié.";
    } else {
      status.textContent = "Texte sélectionné. Utilisez le raccourci Copier.";
    }
  }
});
</script>
</body>
</html>
