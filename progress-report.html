<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point d’avancement</title>
<style>
:root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
body { margin: 16px; }
label { display: block; margin-bottom: 8px; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 250px; padding: 10px; font: inherit; resize: vertical; }
button { margin-top: 12px; padding: 6px 12px; font: inherit; cursor: pointer; }
#status { margin-inline-start: 8px; }
</style>
</head>
<body>
<label for="prompt">Copiez le prompt, puis collez-le dans votre conversation avec accès à Trello.</label>
<textarea id="prompt" readonly>Lis le tableau Trello Promo Lecture — CDP (https://trello.com/b/zquu24NZ/promo-lecture-cdp), en incluant les cartes hors Focus, et rédige en français un point d’avancement en un seul paragraphe, prêt à dire en réunion.

Regroupe l’attention par chantier. Pars des chantiers et actions en Focus, puis ajoute les priorités hautes, les échéances ou relances proches ou dépassées et les urgences forcées qui changent l’ordre du jour. Rattache chaque action Kanban à son chantier via « Chant. par. » ou un lien explicite lorsqu’il existe. Fais ressortir aussi les actions isolées qui méritent l’attention, sans leur inventer de rattachement. Si plusieurs urgences indépendantes dispersent l’attention, dis-le clairement, même si elles relèvent de chantiers différents. Cite un ou deux exemples et indique lesquels traiter en premier, d’après les échéances, les priorités ou ce qu’ils peuvent débloquer. Ne recommande de mettre un chantier en Focus que si le rattachement est établi et si cela aide à concentrer le travail. Dis ce qui a avancé et à quoi cela sert pour le chantier. Distingue une action associée, un préalable encore ouvert et une contribution (« Alimente »). Explique ce que le préalable retarde ou doit permettre de débloquer. Si une urgence hors Focus mérite de réorienter le travail, propose de mettre temporairement le chantier concerné en Focus et explique pourquoi.

Pour chaque attente ou blocage significatif, dis ce qui attend, de qui dépend la suite et quelle réponse, décision ou contribution manque. Croise le statut de la carte, « En attente de », « Blocage », « Interloc. », « Relance » et les cartes liées. Un interlocuteur seul ne prouve pas une attente. Une attente sur une action ne bloque pas forcément tout le chantier. Si une priorité haute est bloquée, dis-le clairement et indique qui relancer, à quelle date si elle est renseignée, ou quelle autre action peut débloquer la suite.

Indique la prochaine étape utile à partir de « Proch. act. » ou d’une action Kanban encore ouverte. Si ces éléments manquent, présente toute prochaine étape comme une proposition. Distingue la date de relance, l’échéance d’une action et le jalon du chantier. Appuie-toi sur les champs renseignés et les notes pertinentes du tableau. Ne déduis ni responsable, ni échéance, ni progrès d’un champ vide. Signale brièvement toute incertitude qui change le point d’avancement. Si le tableau est inaccessible, demande un export récent.</textarea>
<button id="copy" type="button">Copier le prompt</button>
<span id="status" role="status"></span>
<script>
const promptField = document.querySelector("#prompt");
const status = document.querySelector("#status");
document.querySelector("#copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(promptField.value);
    status.textContent = "Prompt copié.";
  } catch {
    promptField.focus();
    promptField.select();
    if (document.execCommand("copy")) {
      status.textContent = "Prompt copié.";
    } else {
      status.textContent = "Texte sélectionné. Utilisez le raccourci Copier.";
    }
  }
});
</script>
</body>
</html>
