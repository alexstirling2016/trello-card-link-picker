<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point d’avancement</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="config.js"></script>
<style>
:root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
body { margin: 16px; }
label { display: block; margin-bottom: 8px; }
textarea { display: block; box-sizing: border-box; width: 100%; min-height: 250px; padding: 10px; font: inherit; resize: vertical; }
button { margin-top: 12px; padding: 6px 12px; font: inherit; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.actions button { margin: 0; }
#status { margin-inline-start: 8px; }
</style>
</head>
<body>
<label for="prompt">Copiez le prompt et, si votre conversation n’a pas accès au tableau, joignez le fichier JSON Trello.</label>
<textarea id="prompt" readonly>À partir du tableau Trello Promo Lecture — CDP (https://trello.com/b/zquu24NZ/promo-lecture-cdp) ou de l’export JSON joint, rédige en français un point d’avancement prêt à dire en réunion. Lis aussi les cartes hors Focus pour repérer les urgences.

Format impératif : 4 courts paragraphes par défaut, 5 au maximum si plusieurs urgences ou blocages distincts le justifient, et 240 mots maximum au total. Commence chaque paragraphe par un sujet en gras et mets aussi en gras les actions clés dans le texte. Aucun titre général, aucune liste, aucune conclusion récapitulative. Une action ou un chantier n’apparaît qu’une fois. Réserve de la place aux dossiers prêts à avancer dès qu’une réponse ou une décision arrive, même sans échéance proche ou hors Focus. Écarte les autres sujets qui ne changent pas la suite.

Ouvre sur les rendez-vous imminents et les urgences forcées qui demandent une action. Puis regroupe les actions qui font avancer le même chantier, y compris les actions Kanban liées et les préalables qui conditionnent la suite. Présente les préalables avant les actions qui en dépendent et signale ceux qu’il faut engager tôt. Si des urgences isolées dispersent l’attention, indique-le brièvement et donne l’ordre de traitement. Repère les actions concrètes qui débloquent plusieurs travaux ou dont le résultat est utile à plusieurs chantiers. À urgence comparable, fais remonter celles qui peuvent être menées rapidement et nomme les suites qu’elles rendent possibles. Les liens « Préalable » et « Alimente » peuvent signaler cet effet. Évalue les suites réelles plutôt que le nombre de liens, et présente une contribution comme un apport. Le Focus, la priorité haute et les échéances aident à choisir les sujets. Ils ne constituent pas une liste à couvrir.

Pour chaque sujet retenu, dis où on en est et quelle action concrète ferait avancer le travail. Si une réponse est le dernier élément attendu, nomme la personne et dis ce que sa réponse permettrait de lancer ou de finaliser. Mentionne la relance et sa date si elles sont renseignées. Interprète « En attente » comme une réponse, contribution ou décision attendue dans le cours normal du travail. Si une personne est nommée dans « Blocage » sur une carte « En attente », utilise son nom pour expliquer de qui dépend la suite, sans qualifier le dossier de bloqué ni suggérer de relance immédiate sans motif. Réserve « bloqué » à un obstacle important à lever, notamment si le statut est « Bloqué ». Distingue un interlocuteur d’une personne dont la réponse est attendue, et une relance d’une échéance ou d’un jalon. Appuie-toi sur les liens et champs renseignés. Présente toute action déduite comme une proposition. Si le tableau est inaccessible et qu’aucun JSON n’est joint, demande un export récent.</textarea>
<div class="actions">
  <button id="copy" type="button">Copier le prompt</button>
  <button id="copy-and-download" type="button">Copier le prompt et télécharger le JSON</button>
  <a href="./open-chatgpt.html" target="_blank" rel="noopener noreferrer">Ouvrir ChatGPT (app)</a>
  <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Ouvrir ChatGPT Web</a>
</div>
<span id="status" role="status"></span>
<button id="authorize-export" type="button" hidden>Autoriser la lecture du tableau</button>
<a id="export-fallback" href="https://trello.com/b/zquu24NZ.json" target="_blank" rel="noopener noreferrer" hidden>Ouvrir le JSON Trello et l’enregistrer</a>
<script>
const promptField = document.querySelector("#prompt");
const status = document.querySelector("#status");
async function copyPrompt() {
  try {
    await navigator.clipboard.writeText(promptField.value);
    status.textContent = "Prompt copié.";
  } catch {
    promptField.focus();
    promptField.select();
    if (document.execCommand("copy")) {
      status.textContent = "Prompt copié.";
    } else {
      status.textContent = "Texte sélectionné. Utilisez le raccourci Copier.";
    }
  }
}

document.querySelector("#copy").addEventListener("click", copyPrompt);
const download = document.querySelector("#copy-and-download");
const fallback = document.querySelector("#export-fallback");
const authorize = document.querySelector("#authorize-export");
const config = window.pickerConfig;
const client = window.TrelloPowerUp.iframe(config);

authorize.addEventListener("click", async () => {
  authorize.disabled = true;
  try {
    const rest = await client.getRestApi();
    await rest.authorize({scope: "read", expiration: "never"});
    authorize.hidden = true;
    status.textContent = "Lecture autorisée. Cliquez à nouveau sur Télécharger le JSON.";
  } catch {
    status.textContent = "Autorisation Trello non obtenue.";
  } finally {
    authorize.disabled = false;
  }
});

async function readTrello(path, query, key, token) {
  const url = new URL("https://api.trello.com/1/" + path);
  url.search = new URLSearchParams({...query, key, token});
  const response = await fetch(url, {referrerPolicy: "no-referrer"});
  if (!response.ok) throw new Error("Trello a refusé la lecture (HTTP " + response.status + ").");
  return response.json();
}

download.addEventListener("click", async () => {
  download.disabled = true;
  fallback.hidden = true;
  try {
    await copyPrompt();
    const copyStatus = status.textContent;
    status.textContent = copyStatus + " Préparation du JSON…";
    const rest = await client.getRestApi();
    const token = await rest.getToken();
    if (!token) {
      authorize.hidden = false;
      status.textContent = copyStatus + " Autorisez la lecture du tableau pour télécharger le fichier.";
      fallback.hidden = false;
      return;
    }
    const {id: boardId} = await client.board("id");
    if (!boardId) throw new Error("Tableau Trello introuvable.");
    const path = "boards/" + encodeURIComponent(boardId);
    const read = (suffix, query) => readTrello(path + suffix, query, config.appKey, token);
    const [board, checklists, actions] = await Promise.all([
      read("", {cards: "all", card_fields: "all", card_customFieldItems: "true", lists: "all", labels: "all", customFields: "true"}),
      read("/checklists", {}),
      read("/actions", {filter: "all", limit: "1000"}),
    ]);
    const file = new Blob([JSON.stringify({...board, checklists, actions}, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(file);
    const link = document.createElement("a");
    link.href = url;
    link.download = "promo-lecture-cdp.json";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    status.textContent = copyStatus + " Téléchargement lancé.";
  } catch (error) {
    const detail = /^(Trello a refusé la lecture \(HTTP \d+\)\.|Tableau Trello introuvable\.)$/.test(error.message) ? error.message : "Le téléchargement direct a échoué.";
    status.textContent = detail + " Vous pouvez ouvrir le JSON Trello et l’enregistrer.";
    fallback.hidden = false;
  } finally {
    download.disabled = false;
  }
});
</script>
</body>
</html>
