<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lier une carte</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="config.js"></script>
<script src="picker.js" type="module"></script>
<style>
  body { margin: 8px; color: #172b4d; font: 14px system-ui, sans-serif; }
  label, input, select { display: block; width: 100%; box-sizing: border-box; }
  input, select, button { padding: 7px; font: inherit; margin: 4px 0 8px; }
  #results { max-height: 158px; overflow: auto; padding: 2px; }
  #results button { display: block; width: 100%; text-align: left; margin: 0 0 4px; }
  #message { min-height: 1.3em; }
</style>
</head>
<body>
<button id="authorize" hidden>Autoriser l’accès à Trello</button>
<form id="form" hidden>
  <label for="relation">Type de lien</label>
  <select id="relation">
    <option value="prerequisite">L’autre carte est un préalable</option>
    <option value="precedes">Cette carte est un préalable</option>
    <option value="feeds">Cette carte alimente l’autre</option>
  </select>
  <label for="search">Rechercher par titre ou par liste</label>
  <input id="search" type="search" autocomplete="off">
  <div id="results" aria-label="Cartes correspondantes"></div>
  <button id="save" disabled>Créer le lien</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</body>
</html>
